<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>О компании — IZODOM Кыргызстан</title>
  <meta name="description" content="Официальный партнёр технологии IZODOM в Кыргызстане.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">IZODOM</a> / <span data-i18n="nav.about"></span></div>
        <h1 data-i18n="about.title"></h1>
        <p class="lead" data-i18n="about.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container split reveal">
        <div class="split-media" style="background:url('assets/img/hero.jpg') center/cover"></div>
        <div>
          <p class="lead" data-i18n="about.p1"></p>
          <p class="lead" data-i18n="about.p2"></p>
          <a href="partneram.html" class="btn btn--primary" data-i18n="common.becomePartner"></a>
        </div>
      </div>
    </section>

    <section class="section section--soft">
      <div class="container">
        <div class="benefits reveal">
          <div class="benefit"><div class="benefit-icon" data-icon="shield"></div><h3 data-i18n="about.val1.t"></h3><p data-i18n="about.val1.d"></p></div>
          <div class="benefit"><div class="benefit-icon" data-icon="speed"></div><h3 data-i18n="about.val2.t"></h3><p data-i18n="about.val2.d"></p></div>
          <div class="benefit"><div class="benefit-icon" data-icon="save"></div><h3 data-i18n="about.val3.t"></h3><p data-i18n="about.val3.d"></p></div>
          <div class="benefit"><div class="benefit-icon" data-icon="globe"></div><h3 data-i18n="about.val4.t"></h3><p data-i18n="about.val4.d"></p></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container stats reveal">
        <div class="stat"><b>30+</b><span data-i18n="home.stat1"></span></div>
        <div class="stat"><b>25 000+</b><span data-i18n="home.stat2"></span></div>
        <div class="stat"><b>40+</b><span data-i18n="home.stat3"></span></div>
        <div class="stat"><b>80%</b><span data-i18n="home.stat4"></span></div>
      </div>
    </section>

    <section class="section section--soft">
      <div class="container"><div class="cta-band reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.text"></p>
        <a href="kontakty.html" class="btn btn--primary btn--lg" data-i18n="common.freeQuote"></a>
      </div></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
