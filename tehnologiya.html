<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Технология IZODOM — Кыргызстан</title>
  <meta name="description" content="Технология IZODOM — несъёмная опалубка (ICF) для строительства энергоэффективных и пассивных домов.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">IZODOM</a> / <span data-i18n="nav.tech"></span></div>
        <span class="eyebrow" data-i18n="home.tech.eyebrow"></span>
        <h1 data-i18n="tech.title"></h1>
        <p class="lead" data-i18n="tech.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container split reveal">
        <div class="split-media" style="background:url('assets/img/tech-cutaway.jpg') center/cover"></div>
        <div>
          <h2 data-i18n="tech.s1.t"></h2>
          <p class="lead" data-i18n="tech.s1.d"></p>
        </div>
      </div>
    </section>

    <section class="section section--soft">
      <div class="container split split--reverse reveal">
        <div class="split-media" style="background:url('assets/img/block-detail.jpg') center/cover"></div>
        <div>
          <h2 data-i18n="tech.s2.t"></h2>
          <p class="lead" data-i18n="tech.s2.d"></p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container split reveal">
        <div class="split-media" style="background:url('assets/img/wall-cutaway.jpg') center/cover"></div>
        <div>
          <h2 data-i18n="tech.s3.t"></h2>
          <p class="lead" data-i18n="tech.s3.d"></p>
          <a href="kalkulyator.html" class="btn btn--primary" data-i18n="common.freeQuote"></a>
        </div>
      </div>
    </section>

    <section class="section section--soft">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <h2 data-i18n="tech.step.title"></h2>
        </div>
        <div class="steps reveal" style="grid-template-columns:repeat(4,1fr)">
          <div class="step"><div class="step-num">01</div><h3 data-i18n="tech.step1.t"></h3><p data-i18n="tech.step1.d"></p></div>
          <div class="step"><div class="step-num">02</div><h3 data-i18n="tech.step2.t"></h3><p data-i18n="tech.step2.d"></p></div>
          <div class="step"><div class="step-num">03</div><h3 data-i18n="tech.step3.t"></h3><p data-i18n="tech.step3.d"></p></div>
          <div class="step"><div class="step-num">04</div><h3 data-i18n="tech.step4.t"></h3><p data-i18n="tech.step4.d"></p></div>
        </div>
      </div>
    </section>

    <!-- APPLICATIONS -->
    <section class="section section--soft">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="apps.eyebrow"></span>
          <h2 data-i18n="apps.title"></h2>
          <p class="lead mx-auto" data-i18n="apps.text"></p>
        </div>
        <div class="apps reveal">
          <div class="app"><span data-icon="home"></span><div><h3 data-i18n="app1.t"></h3><p data-i18n="app1.d"></p></div></div>
          <div class="app"><span data-icon="building"></span><div><h3 data-i18n="app2.t"></h3><p data-i18n="app2.d"></p></div></div>
          <div class="app"><span data-icon="store"></span><div><h3 data-i18n="app3.t"></h3><p data-i18n="app3.d"></p></div></div>
          <div class="app"><span data-icon="school"></span><div><h3 data-i18n="app4.t"></h3><p data-i18n="app4.d"></p></div></div>
          <div class="app"><span data-icon="tent"></span><div><h3 data-i18n="app5.t"></h3><p data-i18n="app5.d"></p></div></div>
          <div class="app"><span data-icon="mountain"></span><div><h3 data-i18n="app6.t"></h3><p data-i18n="app6.d"></p></div></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container"><div class="cta-band reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.text"></p>
        <a href="kontakty.html" class="btn btn--primary btn--lg" data-i18n="common.freeQuote"></a>
      </div></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
