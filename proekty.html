<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проекты — IZODOM Кыргызстан</title>
  <meta name="description" content="Что можно построить по технологии IZODOM: дома, коттеджи, многоквартирные и коммерческие объекты.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">IZODOM</a> / <span data-i18n="nav.projects"></span></div>
        <h1 data-i18n="proj.title"></h1>
        <p class="lead" data-i18n="proj.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="projects reveal">
          <div class="project"><div class="project-media" style="background:url('assets/img/house-modern.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p1.t"></h3><div class="project-specs"><span><b>145</b> м²</span><span><b>4</b> <span data-i18n="proj.spec.rooms"></span></span><span><b>1</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
          <div class="project"><div class="project-media" style="background:url('assets/img/hero.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p2.t"></h3><div class="project-specs"><span><b>120</b> м²</span><span><b>3</b> <span data-i18n="proj.spec.rooms"></span></span><span><b>1</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
          <div class="project"><div class="project-media" style="background:url('assets/img/house-cutaway.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p3.t"></h3><div class="project-specs"><span><b>180</b> м²</span><span><b>5</b> <span data-i18n="proj.spec.rooms"></span></span><span><b>2</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
          <div class="project"><div class="project-media" style="background:url('assets/img/apartments.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p4.t"></h3><div class="project-specs"><span><b>2400</b> м²</span><span><b>36</b> <span data-i18n="proj.spec.rooms"></span></span><span><b>5</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
          <div class="project"><div class="project-media" style="background:url('assets/img/aerial.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p5.t"></h3><div class="project-specs"><span><b>15 000</b> м²</span><span><b>—</b></span><span><b>2–5</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
          <div class="project"><div class="project-media" style="background:url('assets/img/wall-cutaway.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p6.t"></h3><div class="project-specs"><span><b>165</b> м²</span><span><b>4</b> <span data-i18n="proj.spec.rooms"></span></span><span><b>2</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
        </div>
      </div>
    </section>

    <section class="section section--soft">
      <div class="container"><div class="cta-band reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.text"></p>
        <a href="kontakty.html" class="btn btn--primary btn--lg" data-i18n="common.freeQuote"></a>
      </div></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
