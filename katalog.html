<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Продукция IZODOM — Кыргызстан</title>
  <meta name="description" content="Продукция IZODOM: стеновые блоки, фундаментная плита, перекрытия, углы и комплектующие.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumbs"><a href="/">IZODOM</a> / <span data-i18n="nav.catalog"></span></div>
        <h1 data-i18n="cat.title"></h1>
        <p class="lead" data-i18n="cat.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cards reveal">

          <div class="card">
            <div class="prod-media"><img src="assets/img/prod-block25.png" alt="Стеновой блок 25"></div>
            <div class="card-body"><span class="badge" data-i18n="cat.p1.for"></span><h3 data-i18n="cat.p1.t"></h3><p data-i18n="cat.p1.d"></p>
              <ul class="spec-list">
                <li><span data-i18n="cat.spec.thickness"></span><b>25 см</b></li>
                <li><span data-i18n="cat.spec.insulation"></span><b>5 см</b></li>
                <li><span data-i18n="cat.spec.concrete"></span><b>15 см</b></li>
                <li><span data-i18n="cat.spec.r"></span><b>R = 3,45 м²·°C/Вт</b></li>
              </ul></div>
          </div>

          <div class="card">
            <div class="prod-media"><img src="assets/img/prod-block30.png" alt="Стеновой блок 30"></div>
            <div class="card-body"><span class="badge" data-i18n="cat.p2.for"></span><h3 data-i18n="cat.p2.t"></h3><p data-i18n="cat.p2.d"></p>
              <ul class="spec-list">
                <li><span data-i18n="cat.spec.thickness"></span><b>30 см</b></li>
                <li><span data-i18n="cat.spec.insulation"></span><b>10 см</b></li>
                <li><span data-i18n="cat.spec.concrete"></span><b>15 см</b></li>
                <li><span data-i18n="cat.spec.r"></span><b>R = 5,0 м²·°C/Вт</b></li>
              </ul></div>
          </div>

          <div class="card">
            <div class="prod-media"><img src="assets/img/prod-block35.png" alt="Стеновой блок 35"></div>
            <div class="card-body"><span class="badge" data-i18n="cat.p3.for"></span><h3 data-i18n="cat.p3.t"></h3><p data-i18n="cat.p3.d"></p>
              <ul class="spec-list">
                <li><span data-i18n="cat.spec.thickness"></span><b>35 см</b></li>
                <li><span data-i18n="cat.spec.insulation"></span><b>15 см</b></li>
                <li><span data-i18n="cat.spec.concrete"></span><b>15 см</b></li>
                <li><span data-i18n="cat.spec.r"></span><b>R = 6,67 м²·°C/Вт</b></li>
              </ul></div>
          </div>

          <div class="card">
            <div class="prod-media"><img src="assets/img/prod-slab.png" alt="Фундаментная плита IZOSLAB"></div>
            <div class="card-body"><span class="badge" data-i18n="cat.p4.for"></span><h3 data-i18n="cat.p4.t"></h3><p data-i18n="cat.p4.d"></p>
              <ul class="spec-list">
                <li><span data-i18n="cat.spec.r"></span><b>R = 7,14 м²·°C/Вт</b></li>
              </ul></div>
          </div>

          <div class="card">
            <div class="prod-media"><img src="assets/img/prod-slab2.png" alt="Перекрытие IZOCeiling"></div>
            <div class="card-body"><span class="badge" data-i18n="cat.p5.for"></span><h3 data-i18n="cat.p5.t"></h3><p data-i18n="cat.p5.d"></p>
              <ul class="spec-list">
                <li><span data-i18n="cat.spec.r"></span><b>R = 3,12–3,85 м²·°C/Вт</b></li>
              </ul></div>
          </div>

          <div class="card">
            <div class="prod-media"><img src="assets/img/prod-corner-out.png" alt="Углы и доборные элементы"></div>
            <div class="card-body"><span class="badge" data-i18n="cat.p6.for"></span><h3 data-i18n="cat.p6.t"></h3><p data-i18n="cat.p6.d"></p>
              <a class="card-link" href="/kontakty" data-i18n="common.more"></a></div>
          </div>

        </div>
      </div>
    </section>

    <section class="section section--soft">
      <div class="container"><div class="cta-band reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.text"></p>
        <a href="/kontakty" class="btn btn--primary btn--lg" data-i18n="common.freeQuote"></a>
      </div></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
