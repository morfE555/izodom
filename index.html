<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IZODOM Кыргызстан — технология энергоэффективных домов</title>
  <meta name="description" content="IZODOM — несъёмная опалубка для строительства энергоэффективных и пассивных домов. Официальный партнёр в Кыргызстане.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <span class="eyebrow" data-i18n="home.title">Энергоэффективный дом</span>
          <h1 data-i18n="home.heroTag">Несъёмная опалубка для строительства энергоэффективных домов</h1>
          <p class="lead" data-i18n="home.subtitle"></p>
          <div class="hero-cta">
            <a href="/kalkulyator" class="btn btn--primary btn--lg" data-i18n="common.freeQuote"></a>
            <a href="/tehnologiya" class="btn btn--ghost btn--lg" data-i18n="common.learnTech"></a>
          </div>
        </div>
        <div class="hero-visual" data-hero-slider>
          <div class="hero-slide active" style="background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35)),url('assets/img/hero.jpg') center/cover">
            <div class="hero-slide-card">
              <div class="hero-slide-num"><b>01</b> 02 03 04</div>
              <h3 data-i18n="home.slide1.t"></h3>
              <p data-i18n="home.slide1.d"></p>
            </div>
          </div>
          <div class="hero-slide" style="background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35)),url('assets/img/foundation.jpg') center/cover">
            <div class="hero-slide-card">
              <div class="hero-slide-num">01 <b>02</b> 03 04</div>
              <h3 data-i18n="home.slide2.t"></h3>
              <p data-i18n="home.slide2.d"></p>
            </div>
          </div>
          <div class="hero-slide" style="background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35)),url('assets/img/house-cutaway.jpg') center/cover">
            <div class="hero-slide-card">
              <div class="hero-slide-num">01 02 <b>03</b> 04</div>
              <h3 data-i18n="home.slide3.t"></h3>
              <p data-i18n="home.slide3.d"></p>
            </div>
          </div>
          <div class="hero-slide" style="background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35)),url('assets/img/block-detail.jpg') center/cover">
            <div class="hero-slide-card">
              <div class="hero-slide-num">01 02 03 <b>04</b></div>
              <h3 data-i18n="home.slide4.t"></h3>
              <p data-i18n="home.slide4.d"></p>
            </div>
          </div>
          <div class="hero-dots">
            <button class="active" aria-label="1"></button>
            <button aria-label="2"></button>
            <button aria-label="3"></button>
            <button aria-label="4"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- INTRO -->
    <section class="section">
      <div class="container split reveal">
        <div class="split-media" style="background:url('assets/img/house-modern.jpg') center/cover"></div>
        <div>
          <span class="eyebrow" data-i18n="home.intro.eyebrow"></span>
          <h2 data-i18n="home.intro.title"></h2>
          <p class="lead" data-i18n="home.intro.text"></p>
          <a href="/tehnologiya" class="btn btn--dark" data-i18n="common.learnTech"></a>
        </div>
      </div>
    </section>

    <!-- TECH -->
    <section class="section section--soft">
      <div class="container split split--reverse reveal">
        <div class="split-media" style="background:url('assets/img/tech-cutaway.jpg') center/cover"></div>
        <div>
          <span class="eyebrow" data-i18n="home.tech.eyebrow"></span>
          <h2 data-i18n="home.tech.title"></h2>
          <p class="lead" data-i18n="home.tech.text"></p>
          <a href="/katalog" class="btn btn--primary" data-i18n="common.seeProducts"></a>
        </div>
      </div>
    </section>

    <!-- BENEFITS -->
    <section class="section">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="home.ben.eyebrow"></span>
          <h2 data-i18n="home.ben.title"></h2>
        </div>
        <div class="benefits reveal">
          <div class="benefit"><div class="benefit-icon" data-icon="speed"></div><h3 data-i18n="home.ben1.t"></h3><p data-i18n="home.ben1.d"></p></div>
          <div class="benefit"><div class="benefit-icon" data-icon="save"></div><h3 data-i18n="home.ben2.t"></h3><p data-i18n="home.ben2.d"></p></div>
          <div class="benefit"><div class="benefit-icon" data-icon="shield"></div><h3 data-i18n="home.ben3.t"></h3><p data-i18n="home.ben3.d"></p></div>
          <div class="benefit"><div class="benefit-icon" data-icon="sound"></div><h3 data-i18n="home.ben4.t"></h3><p data-i18n="home.ben4.d"></p></div>
        </div>
      </div>
    </section>

    <!-- STATS -->
    <section class="section section--soft">
      <div class="container stats reveal">
        <div class="stat"><b>30+</b><span data-i18n="home.stat1"></span></div>
        <div class="stat"><b>25 000+</b><span data-i18n="home.stat2"></span></div>
        <div class="stat"><b>40+</b><span data-i18n="home.stat3"></span></div>
        <div class="stat"><b>80%</b><span data-i18n="home.stat4"></span></div>
      </div>
    </section>

    <!-- APPLICATIONS -->
    <section class="section section--soft">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="apps.eyebrow"></span>
          <h2 data-i18n="apps.title"></h2>
          <p class="lead mx-auto" data-i18n="apps.text"></p>
        </div>
        <div class="apps reveal">
          <div class="app"><span data-icon="home"></span><div><h3 data-i18n="app1.t"></h3><p data-i18n="app1.d"></p></div></div>
          <div class="app"><span data-icon="building"></span><div><h3 data-i18n="app2.t"></h3><p data-i18n="app2.d"></p></div></div>
          <div class="app"><span data-icon="store"></span><div><h3 data-i18n="app3.t"></h3><p data-i18n="app3.d"></p></div></div>
          <div class="app"><span data-icon="school"></span><div><h3 data-i18n="app4.t"></h3><p data-i18n="app4.d"></p></div></div>
          <div class="app"><span data-icon="tent"></span><div><h3 data-i18n="app5.t"></h3><p data-i18n="app5.d"></p></div></div>
          <div class="app"><span data-icon="mountain"></span><div><h3 data-i18n="app6.t"></h3><p data-i18n="app6.d"></p></div></div>
        </div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="section">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="home.proj.eyebrow"></span>
          <h2 data-i18n="home.proj.title"></h2>
          <p class="lead mx-auto" data-i18n="home.proj.text"></p>
        </div>
        <div class="projects reveal">
          <div class="project"><div class="project-media" style="background:url('assets/img/house-modern.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p1.t"></h3><div class="project-specs"><span><b>145</b> м²</span><span><b>4</b> <span data-i18n="proj.spec.rooms"></span></span><span><b>1</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
          <div class="project"><div class="project-media" style="background:url('assets/img/apartments.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p4.t"></h3><div class="project-specs"><span><b>2400</b> м²</span><span><b>36</b> <span data-i18n="proj.spec.rooms"></span></span><span><b>5</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
          <div class="project"><div class="project-media" style="background:url('assets/img/house-cutaway.jpg') center/cover"></div>
            <div class="project-info"><h3 data-i18n="proj.p3.t"></h3><div class="project-specs"><span><b>180</b> м²</span><span><b>5</b> <span data-i18n="proj.spec.rooms"></span></span><span><b>2</b> <span data-i18n="proj.spec.floors"></span></span></div></div></div>
        </div>
        <div class="text-center" style="margin-top:40px">
          <a href="/proekty" class="btn btn--ghost" data-i18n="common.viewAll"></a>
        </div>
      </div>
    </section>

    <!-- CALC CTA -->
    <section class="section section--soft">
      <div class="container split reveal">
        <div>
          <span class="eyebrow" data-i18n="home.calc.eyebrow"></span>
          <h2 data-i18n="home.calc.title"></h2>
          <p class="lead" data-i18n="home.calc.text"></p>
          <a href="/kalkulyator" class="btn btn--primary btn--lg" data-i18n="home.calc.cta"></a>
        </div>
        <div class="split-media" style="background:url('assets/img/foundation.jpg') center/cover"></div>
      </div>
    </section>

    <!-- BLOG -->
    <section class="section">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="home.blog.eyebrow"></span>
          <h2 data-i18n="home.blog.title"></h2>
        </div>
        <div class="cards reveal">
          <a class="card" href="/blog"><div class="card-media" style="background:url('assets/img/wall-cutaway.jpg') center/cover"></div>
            <div class="card-body"><h3 data-i18n="home.blog1.t"></h3><p data-i18n="home.blog1.d"></p><span class="card-link" data-i18n="common.readMore"></span></div></a>
          <a class="card" href="/blog"><div class="card-media" style="background:url('assets/img/construction.jpg') center/cover"></div>
            <div class="card-body"><h3 data-i18n="home.blog2.t"></h3><p data-i18n="home.blog2.d"></p><span class="card-link" data-i18n="common.readMore"></span></div></a>
          <a class="card" href="/blog"><div class="card-media" style="background:url('assets/img/foundation.jpg') center/cover"></div>
            <div class="card-body"><h3 data-i18n="home.blog3.t"></h3><p data-i18n="home.blog3.d"></p><span class="card-link" data-i18n="common.readMore"></span></div></a>
        </div>
      </div>
    </section>

    <!-- TESTIMONIALS -->
    <section class="section section--soft">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="home.ref.eyebrow"></span>
          <h2 data-i18n="home.ref.title"></h2>
        </div>
        <div class="testimonials reveal" data-testi>
          <div class="testi-track">
            <div class="testi"><div class="testi-stars">★★★★★</div><p data-i18n="home.ref1.txt"></p><div class="testi-author"><b data-i18n="home.ref1.a"></b><span data-i18n="home.ref1.r"></span></div></div>
            <div class="testi"><div class="testi-stars">★★★★★</div><p data-i18n="home.ref2.txt"></p><div class="testi-author"><b data-i18n="home.ref2.a"></b><span data-i18n="home.ref2.r"></span></div></div>
            <div class="testi"><div class="testi-stars">★★★★★</div><p data-i18n="home.ref3.txt"></p><div class="testi-author"><b data-i18n="home.ref3.a"></b><span data-i18n="home.ref3.r"></span></div></div>
            <div class="testi"><div class="testi-stars">★★★★★</div><p data-i18n="home.ref4.txt"></p><div class="testi-author"><b data-i18n="home.ref4.a"></b><span data-i18n="home.ref4.r"></span></div></div>
          </div>
          <div class="slider-nav">
            <button data-prev aria-label="prev">‹</button>
            <button data-next aria-label="next">›</button>
          </div>
        </div>
      </div>
    </section>

    <!-- CTA BAND -->
    <section class="section">
      <div class="container">
        <div class="cta-band reveal">
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.text"></p>
          <a href="/kontakty" class="btn btn--primary btn--lg" data-i18n="common.freeQuote"></a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
