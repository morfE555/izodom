<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Партнёрство — IZODOM Кыргызстан</title>
  <meta name="description" content="Партнёрство для роста: приглашаем дистрибьюторов, застройщиков и подрядчиков Кыргызстана.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumbs"><a href="/">IZODOM</a> / <span data-i18n="nav.partners"></span></div>
        <h1 data-i18n="partners.title"></h1>
        <p class="lead" data-i18n="partners.subtitle"></p>
        <a href="#formats" class="btn btn--primary" style="margin-top:8px" data-i18n="common.becomePartner"></a>
      </div>
    </section>

    <!-- WHY -->
    <section class="section">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="partners.why.eyebrow"></span>
          <h2 data-i18n="partners.why.title"></h2>
        </div>
        <div class="stats reveal" style="grid-template-columns:repeat(3,1fr)">
          <div class="stat"><b data-i18n="partners.why1.n"></b><span data-i18n="partners.why1.d"></span></div>
          <div class="stat"><b data-i18n="partners.why2.n"></b><span data-i18n="partners.why2.d"></span></div>
          <div class="stat"><b data-i18n="partners.why3.n"></b><span data-i18n="partners.why3.d"></span></div>
        </div>
      </div>
    </section>

    <!-- FORMATS -->
    <section class="section section--soft" id="formats">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="partners.formats.eyebrow"></span>
          <h2 data-i18n="partners.formats.title"></h2>
        </div>
        <div class="cards reveal">
          <div class="card"><div class="card-body"><span data-icon="store" style="display:block;width:36px;height:36px;color:var(--green);margin-bottom:12px"></span><h3 data-i18n="partners.f1.t"></h3><p data-i18n="partners.f1.d"></p></div></div>
          <div class="card"><div class="card-body"><span data-icon="building" style="display:block;width:36px;height:36px;color:var(--green);margin-bottom:12px"></span><h3 data-i18n="partners.f2.t"></h3><p data-i18n="partners.f2.d"></p></div></div>
          <div class="card"><div class="card-body"><span data-icon="shield" style="display:block;width:36px;height:36px;color:var(--green);margin-bottom:12px"></span><h3 data-i18n="partners.f3.t"></h3><p data-i18n="partners.f3.d"></p></div></div>
        </div>
      </div>
    </section>

    <!-- STEPS -->
    <section class="section">
      <div class="container">
        <div class="text-center reveal" style="max-width:640px;margin:0 auto 48px">
          <span class="eyebrow" data-i18n="partners.steps.eyebrow"></span>
          <h2 data-i18n="partners.steps.title"></h2>
        </div>
        <div class="steps reveal">
          <div class="step"><div class="step-num">01</div><h3 data-i18n="partners.st1.t"></h3><p data-i18n="partners.st1.d"></p></div>
          <div class="step"><div class="step-num">02</div><h3 data-i18n="partners.st2.t"></h3><p data-i18n="partners.st2.d"></p></div>
          <div class="step"><div class="step-num">03</div><h3 data-i18n="partners.st3.t"></h3><p data-i18n="partners.st3.d"></p></div>
          <div class="step"><div class="step-num">04</div><h3 data-i18n="partners.st4.t"></h3><p data-i18n="partners.st4.d"></p></div>
          <div class="step"><div class="step-num">05</div><h3 data-i18n="partners.st5.t"></h3><p data-i18n="partners.st5.d"></p></div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="section section--soft">
      <div class="container"><div class="cta-band reveal">
        <h2 data-i18n="partners.cta.title"></h2>
        <p data-i18n="partners.cta.text"></p>
        <a href="/kontakty" class="btn btn--primary btn--lg" data-i18n="common.becomePartner"></a>
      </div></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
