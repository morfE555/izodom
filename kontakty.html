<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — IZODOM Кыргызстан</title>
  <meta name="description" content="Свяжитесь с IZODOM Кыргызстан — оставьте заявку на бесплатный расчёт.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">IZODOM</a> / <span data-i18n="nav.contacts"></span></div>
        <h1 data-i18n="contacts.title"></h1>
        <p class="lead" data-i18n="contacts.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div class="reveal">
          <div class="contact-item"><span data-icon="pin"></span><div><b data-i18n="contacts.addr.t"></b><span data-i18n="contacts.addr.v"></span></div></div>
          <div class="contact-item"><span data-icon="phone"></span><div><b data-i18n="contacts.phone.t"></b><a href="tel:+996700000000">+996 700 000 000</a></div></div>
          <div class="contact-item"><span data-icon="mail"></span><div><b data-i18n="contacts.email.t"></b><a href="mailto:info@izodom.kg">info@izodom.kg</a></div></div>
          <div class="contact-item"><span data-icon="clock"></span><div><b data-i18n="contacts.hours.t"></b><span data-i18n="contacts.hours.v"></span></div></div>
          <div class="split-media" style="background:url('assets/img/house-modern.jpg') center/cover;min-height:240px;border-radius:16px;margin-top:10px"></div>
        </div>

        <div class="calc-form reveal">
          <h3 data-i18n="contacts.form.title"></h3>
          <form data-contact>
            <div class="field"><label data-i18n="contacts.form.name"></label><input type="text" name="name" required></div>
            <div class="form-grid">
              <div class="field"><label data-i18n="contacts.form.phone"></label><input type="tel" name="phone" required></div>
              <div class="field"><label data-i18n="contacts.form.email"></label><input type="email" name="email"></div>
            </div>
            <div class="field"><label data-i18n="contacts.form.msg"></label><textarea name="msg"></textarea></div>
            <label style="display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.9rem;margin-bottom:16px">
              <input type="checkbox" required style="width:auto;margin-top:4px">
              <span data-i18n="contacts.form.consent"></span>
            </label>
            <button type="submit" class="btn btn--primary btn--lg" data-i18n="common.send"></button>
            <div class="form-msg" data-msg></div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
